<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>__TITLE__ · 调用链图谱</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#2a3550; --fg:#dbe4f5; --dim:#8496b8; --accent:#5aa2ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .stat { color:var(--dim); font-size:12px; }
  #toolbar { padding:8px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  #toolbar input[type=text], #toolbar select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
  #toolbar button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; }
  #toolbar button.primary { background:var(--accent); color:#08101f; border-color:var(--accent); font-weight:600; }
  #toolbar button:hover { border-color:var(--accent); }
  #main { flex:1; display:flex; min-height:0; }
  #entries { width:250px; border-right:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:10px; }
  #entries h2 { font-size:13px; margin:2px 0 8px; color:var(--dim); }
  #entrysearch { width:100%; margin-bottom:8px; background:#101728; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  .ent { padding:6px 8px; border-radius:6px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; }
  .ent:hover { background:#20304f; border-color:var(--accent); }
  .ent b { display:block; font-size:12.5px; font-weight:600; word-break:break-all; }
  .ent span { font-size:11px; color:#7dd8e8; }
  .ent.custom span { color:#ffcf7d; }
  .grp { font-size:11px; color:var(--dim); margin:10px 0 4px; border-bottom:1px dashed var(--line); padding-bottom:2px; }
  #graph { flex:1; }
  #side { width:420px; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:14px; }
  pre.src { max-height:360px; overflow:auto; background:#0b101c; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:12px/1.5 Consolas,"Courier New",monospace; white-space:pre; color:#c7d3ec; margin:0; }
  .card { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; background:#101728; }
  .card h3 { margin:0 0 6px; font-size:14px; word-break:break-all; }
  .card .meta { color:var(--dim); font-size:12px; margin-bottom:4px; }
  .card a { color:var(--accent); text-decoration:none; }
  .tag { display:inline-block; background:#20304f; border-radius:4px; padding:1px 7px; font-size:11px; margin-right:5px; margin-top:4px; }
  .tag.entry { background:#3d2f12; color:#ffcf7d; border:1px solid #6b5320; }
  .tag.route { background:#12333d; color:#7dd8e8; }
  .empty { color:var(--dim); padding:20px; text-align:center; }
  #legend { display:flex; gap:8px; flex-wrap:wrap; }
  #legend span { font-size:11px; color:var(--dim); }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:3px; vertical-align:-1px; }
</style>
</head>
<body>
<div id="errbanner" style="display:none;background:#5c1f24;color:#ffb3b8;padding:8px 16px;font-size:13px"></div>
<header>
  <h1>__TITLE__ · 调用链图谱</h1>
  <span class="stat" id="stat"></span>
  <div id="legend" style="margin-left:auto"></div>
</header>
<div id="toolbar">
  <input type="text" id="search" placeholder="搜索 函数名 / 模块名 / 路由…" style="width:230px"/>
  <select id="modfilter"><option value="">全部模块</option></select>
  <select id="entryfilter">
    <option value="">全部函数</option>
    <option value="entry">仅入口（路由/Worker）</option>
    <option value="hub">仅 Hub（被调 ≥10）</option>
  </select>
  <button class="primary" id="btnfocus">聚焦选中链路</button>
  <button id="btnreset">重置视图</button>
  <span style="color:var(--dim);font-size:12px">单击节点看详情 · 双击聚焦上下游 · 拖拽平移 · 滚轮缩放</span>
</div>
<div id="main">
  <div id="entries">
    <h2>入口（点击看执行流）</h2>
    <input type="text" id="entrysearch" placeholder="过滤入口…"/>
    <div id="entrylist"></div>
  </div>
  <div id="graph"></div>
  <div id="side"><div class="empty">点击节点查看调用方 / 被调方 / 源码</div></div>
</div>
<script src="callchain_data.js"></script>
<script src="callchain_app.js"></script>
</body>
</html>
