<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>byte-wiki</title>
    <script>
      // 主题预热：同步、在 CSS 解析前执行，消除首帧 FOUC。
      // 读 localStorage → 迁移 legacy themeId / v4 工具色预设结构 → 解析 mode → 注入基础层 CSS 变量 + 区域覆盖；
      // 非 paper/custom 预设用户首帧用纸墨兜底色板，main.ts 接管后立即修正（几乎无感）。
      (function () {
        try {
          var PAPER = {
            dark: { primary:"#f2f2f0", primaryBg:"rgba(242,242,240,0.15)", colorHover:"rgba(255,255,255,0.05)", primaryBorder:"rgba(242,242,240,0.4)", bgBase:"#191a1c", bgSurface:"#232527", bgInput:"#2d2f31", bgElevated:"#282a2c", textPrimary:"#ececee", textSecondary:"#a3a6aa", textTertiary:"#74777c", borderBase:"#3a3c3f", borderLight:"#2d2f31" },
            light:{ primary:"#1b1c1f", primaryBg:"rgba(27,28,31,0.15)", colorHover:"rgba(28,29,33,0.04)", primaryBorder:"rgba(27,28,31,0.4)", bgBase:"#f1f1ee", bgSurface:"#ffffff", bgInput:"#f3f3f1", bgElevated:"#f8f8f7", textPrimary:"#1c1d21", textSecondary:"#5c6167", textTertiary:"#97999d", borderBase:"#dcdcd9", borderLight:"#e9e9e7" }
          };
          var raw = localStorage.getItem("byte-wiki-theme");
          var s = raw ? JSON.parse(raw) : null;
          // 旧 {themeId, mode} 结构 → preset 映射（v5 纸感系；custom 首帧用 paper 兜底，main.ts 迁移真实自定义色）
          if (s && s.themeId) {
            var m = { "calm-blue":"indigo", "minimal-green":"celadon", "rust-amber":"tea", "custom":"custom" };
            s = { preset: m[s.themeId] || "paper", mode: s.mode || "auto", custom: null, regions: { light:{}, dark:{} } };
          }
          // v4 工具色预设 → v5 纸感预设（按色相就近归并）
          if (s && s.preset && !s.themeId) {
            var v4 = { "blue":"indigo", "emerald":"celadon", "violet":"plum", "amber":"tea", "rose":"paper" };
            if (v4[s.preset]) s.preset = v4[s.preset];
          }
          if (!s || typeof s !== "object" || !s.preset) s = { preset: "paper", mode: "auto", custom: null, regions: { light:{}, dark:{} } };

          var prefMode = s.mode;
          var mode = prefMode === "light" || prefMode === "dark"
            ? prefMode
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

          var p = (s.preset === "custom" && s.custom && s.custom[mode]) ? s.custom[mode] : PAPER[mode];
          var root = document.documentElement;
          root.setAttribute("data-theme", mode);
          var map = {
            primary:"--color-primary", primaryBg:"--color-primary-bg", colorHover:"--color-hover", primaryBorder:"--color-primary-border",
            bgBase:"--bg-base-orig", bgSurface:"--bg-surface-orig", bgInput:"--bg-input-orig", bgElevated:"--bg-elevated-orig",
            textPrimary:"--text-primary", textSecondary:"--text-secondary", textTertiary:"--text-tertiary",
            borderBase:"--border-base", borderLight:"--border-light"
          };
          Object.keys(map).forEach(function (k) { root.style.setProperty(map[k], p[k]); });
          root.style.setProperty("--accent", p.primary);

          // 区域语义层：仅注入用户覆盖项；未覆盖的由 :root var() 自动跟随基础层
          var rmap = {
            "header.bg":"--bg-header-orig", "header.text":"--text-header", "header.textSub":"--text-header-sub",
            "sider.bg":"--bg-sider-orig", "sider.text":"--text-sider", "sider.textSub":"--text-sider-sub",
            "footer.bg":"--bg-footer-orig", "footer.text":"--text-footer", "footer.textSub":"--text-footer-sub",
            "content.bg":"--bg-content-orig", "content.text":"--text-content", "content.textSub":"--text-content-sub",
            "card.bg":"--bg-card-orig", "card.text":"--text-card", "card.textSub":"--text-card-sub"
          };
          if (s.regions && s.regions[mode]) {
            Object.keys(s.regions[mode]).forEach(function (k) {
              if (rmap[k]) root.style.setProperty(rmap[k], s.regions[mode][k]);
            });
          }
        } catch (e) { /* 静默，derivation.css + main.ts 兜底 */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
