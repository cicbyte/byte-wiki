[project]
name = "byte-wiki-tests"
version = "0.1.0"
description = "byte-wiki CLI + REST API 端到端测试"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pyyaml>=6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["testcases"]
markers = [
    "smoke: 冒烟测试",
    "crud: 增删改查",
    "search: 搜索",
    "trash: 回收站",
    "backup: 备份恢复",
    "api: REST API",
]
