[workspace]
resolver = "2"
members = ["crates/core", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["cicbyte"]
license = "MIT"
repository = "https://github.com/cicbyte/byte-wiki"

[workspace.dependencies]
# === core 共享依赖 ===
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }

# === 数据层 ===
rusqlite = { version = "0.32", features = ["bundled"] }

# === MCP（CLI 用）===
rmcp = { version = "2.2", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1"

[profile.release]
opt-level = "z"      # 体积优先（PRD 目标 <30MB）
lto = true
codegen-units = 1
strip = true
panic = "abort"
